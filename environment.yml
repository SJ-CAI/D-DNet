name: ddnet
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - cartopy                     # installed via conda-forge to avoid dependency conflicts
  - pip:
      # Deep learning
      - tensorflow==2.14.0
      - keras==2.14.0
      - cupy-cuda12x==12.2.0    # GPU array (CUDA 12); use cupy-cuda11x for CUDA 11
      # Scientific computing
      - numpy==1.26.1
      - scipy==1.10.1
      - scikit-learn==1.2.2
      - h5py==3.10.0
      # Visualisation
      - matplotlib==3.8.1
      - pillow==10.1.0
      # Data I/O
      - pyyaml==6.0.1
      - requests==2.31.0
      # Jupyter
      - notebook
      - ipython
